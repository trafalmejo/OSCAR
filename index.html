<!doctype html>
<!-- The project page moved to www.createwithoscar.com. GitHub Pages cannot
     answer with a real redirect, so this page sends the browser on at once
     and tells search engines where the canonical page is. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSCAR has moved to createwithoscar.com</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.createwithoscar.com/">
<meta http-equiv="refresh" content="0; url=https://www.createwithoscar.com/">
<script>location.replace("https://www.createwithoscar.com/");</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ff3663; color: #fff; font: 18px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; text-align: center; }
  a { color: #fff; font-weight: 700; }
</style>
</head>
<body>
<p>OSCAR's website is now at <a href="https://www.createwithoscar.com/">www.createwithoscar.com</a>.</p>
</body>
</html>
