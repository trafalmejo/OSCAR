<!doctype html>
<html>
<head>
<title>Media Player Remote</title>
<!--
  Media Player Remote: choose a clip by its tile, set how it plays and how it
  looks, and watch the audio levels come back. For someone running a media
  server (Resolume, MadMapper, a TouchDesigner player) from a tablet.

  Open it from Load, or paste this whole file into Import. It is ordinary
  HTML and CSS with two OSCAR additions:

  - data-gjs-* attributes hold each widget's settings (data-gjs-message is its
    OSC address) and data-gjs-dmode="flow", which makes a part move through
    the layout when dragged instead of being pulled out of it.
  - data-osc-style and data-osc-appearance on <body> pick the widget style.

  The layout is a CSS grid that rearranges at 992px and 480px, the widths of
  the editor's Tablet and Mobile views, so edits made in those views land in
  the same media queries.

  Clips: one tile per item, written as label|value and separated by ";". Add
  a picture as a third part, label|value|images/forest.jpg, and the tile shows
  it. The two meters only listen: point your software's OSC output at OSCAR
  and send a number from 0 to 1 to their addresses.

  OSC addresses:
    out  /clip/select   /transport/play   /layer/select   /clip/speed
         /layer/opacity   /layer/tint   /caption/text
    in   /audio/left   /audio/right
-->
<style>
.mpr {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "header header header" "clips playback look" "clips playback levels";
  gap: 16px;
  padding: 16px;
  min-height: 100vh;
}
.mpr-header {
  grid-area: header;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.mpr-title {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
}
.mpr-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--osc-border);
  border-radius: var(--osc-radius);
  background-color: var(--osc-card);
}
.mpr-clips { grid-area: clips; }
.mpr-playback { grid-area: playback; }
.mpr-look { grid-area: look; }
.mpr-levels { grid-area: levels; }
.mpr-heading {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.7;
}
.mpr-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.mpr-label {
  font-size: 12px;
  opacity: 0.7;
}
.mpr-clips > .oscar-media-browser {
  flex: 1;
  width: 100%;
  padding: 0;
  grid-auto-rows: minmax(72px, 1fr);
}
.mpr-field > select,
.mpr-field > input[type="number"],
.mpr-field > input[type="text"],
.mpr-field > input[type="range"],
.mpr-field > input[type="color"],
.mpr-field > button {
  width: 100%;
}
.mpr-field > input[type="color"] {
  height: 72px;
}
.mpr-field > button {
  min-height: 56px;
}
.mpr-meters {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.mpr-meter {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  align-items: center;
  gap: 8px;
}
.mpr-meter > .oscar-meter {
  width: 100%;
  height: 18px;
}
#mpr-stop {
  min-height: 48px;
  border-color: #e5484d;
  background-color: #e5484d;
  color: #ffffff;
}
#mpr-stop.toggle,
#mpr-stop:hover {
  border-color: #ce2c31;
  background-color: #ce2c31;
  color: #ffffff;
}

@media (max-width: 992px) {
  .mpr {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: auto;
    grid-template-areas: "header header" "clips clips" "playback look" "levels levels";
    min-height: 0;
  }
}

@media (max-width: 480px) {
  .mpr {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "header" "clips" "playback" "look" "levels";
    gap: 12px;
    padding: 12px;
  }
  .mpr-panel {
    padding: 12px;
  }
  .mpr-title {
    font-size: 16px;
  }
  .mpr-clips > .oscar-media-browser {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
</style>
</head>
<body data-osc-style="supabase" data-osc-appearance="dark">
<div id="mpr" class="mpr" data-gjs-dmode="flow">

  <header id="mpr-header" class="mpr-header" data-gjs-dmode="flow">
    <h1 id="mpr-title" class="mpr-title" data-gjs-dmode="flow">Media Player</h1>
    <button id="mpr-stop" data-gjs-dmode="flow" data-gjs-message="/transport/stop">Stop all</button>
  </header>

  <section id="mpr-clips" class="mpr-panel mpr-clips" data-gjs-dmode="flow">
    <h2 id="mpr-clips-title" class="mpr-heading" data-gjs-dmode="flow">Clips</h2>
    <div id="mpr-browser" class="oscar-media-browser" data-gjs-dmode="flow" data-gjs-message="/clip/select"
      data-gjs-columns="4" data-gjs-show-labels="true" data-gjs-arg-type="i"
      data-gjs-items="Forest|1; Waves|2; City|3; Clouds|4; Particles|5; Tunnel|6; Fire|7; Aurora|8; Logo|9; Text|10; Camera|11; Black|12"></div>
  </section>

  <section id="mpr-playback" class="mpr-panel mpr-playback" data-gjs-dmode="flow">
    <h2 id="mpr-playback-title" class="mpr-heading" data-gjs-dmode="flow">Playback</h2>
    <div id="mpr-play-field" class="mpr-field" data-gjs-dmode="flow">
      <button id="mpr-play" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/transport/play">Play</button>
    </div>
    <div id="mpr-layer-field" class="mpr-field" data-gjs-dmode="flow">
      <span id="mpr-layer-label" class="mpr-label" data-gjs-dmode="flow">Layer</span>
      <select id="mpr-layer" class="oscar-dropdown" data-gjs-dmode="flow" data-gjs-message="/layer/select"
        data-gjs-options="Layer 1=1, Layer 2=2, Layer 3=3, Layer 4=4" data-gjs-value="1" data-gjs-arg-type="i"></select>
    </div>
    <div id="mpr-speed-field" class="mpr-field" data-gjs-dmode="flow">
      <span id="mpr-speed-label" class="mpr-label" data-gjs-dmode="flow">Speed</span>
      <input id="mpr-speed" type="number" class="oscar-number-input" data-gjs-dmode="flow" data-gjs-message="/clip/speed"
        data-gjs-value="1" data-gjs-min="0" data-gjs-max="4" data-gjs-step="0.25" data-gjs-arg-type="f">
    </div>
    <div id="mpr-opacity-field" class="mpr-field" data-gjs-dmode="flow">
      <span id="mpr-opacity-label" class="mpr-label" data-gjs-dmode="flow">Opacity</span>
      <input id="mpr-opacity" type="range" step="0.01" min="0" max="1" orient="horizontal" data-gjs-dmode="flow"
        data-gjs-message="/layer/opacity" data-gjs-min="0" data-gjs-max="1" data-gjs-value="1" data-gjs-orientation="horizontal">
    </div>
  </section>

  <section id="mpr-look" class="mpr-panel mpr-look" data-gjs-dmode="flow">
    <h2 id="mpr-look-title" class="mpr-heading" data-gjs-dmode="flow">Look</h2>
    <div id="mpr-tint-field" class="mpr-field" data-gjs-dmode="flow">
      <span id="mpr-tint-label" class="mpr-label" data-gjs-dmode="flow">Tint</span>
      <input id="mpr-tint" type="color" data-gjs-dmode="flow" data-gjs-message="/layer/tint"
        data-gjs-value="#ffffff" data-gjs-format="rgb" data-gjs-scale="unit">
    </div>
    <div id="mpr-caption-field" class="mpr-field" data-gjs-dmode="flow">
      <span id="mpr-caption-label" class="mpr-label" data-gjs-dmode="flow">Caption</span>
      <input id="mpr-caption" type="text" class="oscar-text-input" data-gjs-dmode="flow" data-gjs-message="/caption/text"
        data-gjs-placeholder="Type, then press Enter" data-gjs-arg-type="s">
    </div>
  </section>

  <section id="mpr-levels" class="mpr-panel mpr-levels" data-gjs-dmode="flow">
    <h2 id="mpr-levels-title" class="mpr-heading" data-gjs-dmode="flow">Audio in</h2>
    <div id="mpr-meters" class="mpr-meters" data-gjs-dmode="flow">
      <div id="mpr-meter-left" class="mpr-meter" data-gjs-dmode="flow">
        <span id="mpr-left-label" class="mpr-label" data-gjs-dmode="flow">L</span>
        <div id="mpr-left" class="oscar-meter" data-gjs-dmode="flow" data-gjs-message="/audio/left"
          data-gjs-listen="true" data-gjs-min="0" data-gjs-max="1" data-gjs-peak-hold="1.5"></div>
      </div>
      <div id="mpr-meter-right" class="mpr-meter" data-gjs-dmode="flow">
        <span id="mpr-right-label" class="mpr-label" data-gjs-dmode="flow">R</span>
        <div id="mpr-right" class="oscar-meter" data-gjs-dmode="flow" data-gjs-message="/audio/right"
          data-gjs-listen="true" data-gjs-min="0" data-gjs-max="1" data-gjs-peak-hold="1.5"></div>
      </div>
    </div>
  </section>

</div>
</body>
</html>
