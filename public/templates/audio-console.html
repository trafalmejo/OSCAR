<!doctype html>
<html>
<head>
<title>Audio Console</title>
<!--
  Audio Console, machined from aluminium: eight channel strips and a master,
  each a recessed LED meter beside a fader, with Mute and Solo under it. For
  a sound desk driven from a tablet (a digital mixer's OSC remote, Ableton,
  Reaper, QLab), or for watching levels from the back of the room.

  Open it from File > Open project or template, or paste this whole file into
  Import. It is ordinary HTML and CSS with two OSCAR additions:

  - data-gjs-* attributes hold each widget's settings (data-gjs-message is its
    OSC address) and data-gjs-dmode="flow", which makes a part move through
    the layout when dragged instead of being pulled out of it.
  - data-osc-style="own" on <body> says the page brings its own look, and the
    first rule sets the colour tokens for it. Pick another widget style in
    the editor and the whole desk is redrawn in that style's colours: every
    rule that paints is written for "own" alone, and a short set of rules
    further down, made of tokens only, dresses it for the others.

  The dress: one slab of brushed aluminium on a graphite desk, the strips
  milled into it, names etched into the metal, meters as LED ladders set
  into black slots, faders with a chamfered chrome cap on a dark rail, and
  keys like a laptop's, black with a soft light when pressed: red for Mute,
  amber for Solo and Dim. The metal is all CSS: layered gradients for the
  grain and the sheen, inset shadows for the milling, nothing drawn by hand.
  The metal catches the light: a band of light sweeps slowly across the
  slab, a key flares with a glint across it when it is pressed, and a fader
  cap brightens while it is being moved. All of it is CSS animation, on the
  "own" dress alone. A small status light in the header is on while the
  master is live and goes out when it is muted: OSCAR puts the class
  "toggle" on a button that is down, and the page watches it with :has().

  The layout is a CSS grid that rearranges at 992px and 480px, the widths of
  the editor's Tablet and Mobile views, so edits made in those views land in
  the same media queries.

  The meters are coloured by level, green to amber to red, the way a desk's
  are. The scale is painted on the whole ladder and the unlit part is covered
  from the top, so a colour always means the same level.

  The meters only listen: point your software's OSC output at OSCAR and send
  each one a number from 0 to 1. The faders send and do not follow; tick Data
  in on a fader to have it follow the desk as well, the way a motorised fader
  does.

  OSC addresses:
    out  /ch/<n>/fader   /ch/<n>/mute   /ch/<n>/solo
         /master/fader   /master/mute   /master/dim
    in   /ch/<n>/level   /master/level/left   /master/level/right
-->
<style>
[data-osc-style="own"] {
  --osc-background: #121317;
  --osc-foreground: #e8e9ec;
  --osc-card: #d6d8dc;
  --osc-muted: #15161a;
  --osc-accent: #8e9096;
  --osc-accent-foreground: #121317;
  --osc-border: #9a9da3;
  --osc-input: #15161a;
  --osc-primary: #d5d7dc;
  --osc-primary-foreground: #1b1c20;
  --osc-ring: #4f8cff;
  --osc-radius: 10px;
  --osc-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, system-ui, sans-serif;
}

/* ---- the metal, in three gradients used all over -----------------------------------------
   The grain: fine lines across the brushing. The sheen: a soft band of light
   sweeping the slab. The body: the aluminium itself, lit from above. */
[data-osc-style="own"] {
  --acn-grain: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.07) 0 1px, rgba(0, 0, 0, 0) 1px 2px, rgba(0, 0, 0, 0.05) 2px 3px, rgba(0, 0, 0, 0) 3px 4px);
  --acn-sheen: linear-gradient(115deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0.28) 46%, rgba(255, 255, 255, 0) 58%);
  --acn-metal: linear-gradient(180deg, #e9eaed, #d3d5d9 48%, #c2c5ca 52%, #cfd1d6);
}

/* ---- the room: a graphite desk under a soft light ------------------------------------------ */
.acn {
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 100vh;
  padding: 22px;
  box-sizing: border-box;
}
[data-osc-style="own"] .acn {
  background:
    radial-gradient(70% 50% at 50% 0%, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0)),
    linear-gradient(180deg, #1a1b20, #0e0f12);
  color: #e8e9ec;
  font-family: var(--osc-font);
}

/* ---- the header: a graphite bar, the name, and a status light ------------------------------ */
.acn-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 20px;
  border-radius: 12px;
}
[data-osc-style="own"] .acn-header {
  background: linear-gradient(180deg, #2a2c32, #1c1e23);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 10px 24px rgba(0, 0, 0, 0.45);
  color: #f2f3f5;
}

.acn-plate {
  display: grid;
  gap: 2px;
}

.acn-title {
  margin: 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.acn-hint {
  font-size: 12px;
  opacity: 0.6;
}

/* The status cluster: a light and its word, right of the name. */
.acn-status {
  display: flex;
  align-items: center;
  flex: none;
  gap: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  pointer-events: none;
}
[data-osc-style="own"] .acn-status {
  color: rgba(242, 243, 245, 0.55);
}
.acn-led {
  display: block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  animation: acn-breathe 2.6s ease-in-out infinite;
}
[data-osc-style="own"] .acn-led {
  background: radial-gradient(circle at 35% 35%, #c8ffd8, #30d158 55%, #1a8a3a);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 10px rgba(48, 209, 88, 0.8);
}

/* The master muted: the light goes out. */
.acn:has(#acn-master-mute.toggle) .acn-led {
  animation: none;
}
[data-osc-style="own"] .acn:has(#acn-master-mute.toggle) .acn-led {
  background: radial-gradient(circle at 35% 35%, #4a4c52, #26282d 60%);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
}

@keyframes acn-sweep {
  0% { background-position: 120% 0; }
  100% { background-position: -20% 0; }
}
@keyframes acn-glint {
  0% { opacity: 0; transform: translateX(-120%); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateX(120%); }
}
@keyframes acn-cap {
  0% { filter: brightness(1.75); }
  100% { filter: brightness(1); }
}

/* The light breathes: only its brightness moves, so it breathes under every style. */
@keyframes acn-breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

/* ---- the slab: one piece of brushed aluminium, the strips milled into it ------------------- */
.acn-strips {
  position: relative;
  flex: 1;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr)) minmax(0, 1.3fr);
  gap: 12px;
}
/* The light on the metal moves: a band sweeps the slab every half minute. */
.acn-strips::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
}
[data-osc-style="own"] .acn-strips::after {
  background: linear-gradient(115deg, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, 0.22) 50%, rgba(255, 255, 255, 0) 58%);
  background-size: 300% 100%;
  opacity: 1;
  animation: acn-sweep 28s linear infinite;
}
[data-osc-style="own"] .acn-strips {
  padding: 14px;
  border-radius: 18px;
  background: var(--acn-sheen), var(--acn-grain), var(--acn-metal);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 -1px 0 rgba(0, 0, 0, 0.25),
    0 1px 0 #6d7076,
    0 18px 40px rgba(0, 0, 0, 0.55);
}

.acn-strip {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  min-width: 0;
  padding: 14px 10px 12px;
  border: 1px solid var(--osc-border);
  border-radius: var(--osc-radius);
  background-color: var(--osc-card);
}
[data-osc-style="own"] .acn-strip {
  border: 0;
  border-radius: 12px;
  background: var(--acn-grain), linear-gradient(180deg, #c9ccd1, #d6d8dc 10%, #cfd1d6 90%, #c4c7cc);
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, 0.22),
    inset 0 0 0 1px rgba(0, 0, 0, 0.12),
    inset 0 -1px 0 rgba(255, 255, 255, 0.55);
}

[data-osc-style="own"] .acn-master {
  background: var(--acn-grain), linear-gradient(180deg, #bfc2c8, #ccced3 10%, #c6c9ce 90%, #babdc3);
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, 0.28),
    inset 0 0 0 1px rgba(0, 0, 0, 0.16),
    inset 0 -1px 0 rgba(255, 255, 255, 0.5);
}

/* The name: etched into the metal. */
.acn-name {
  overflow: hidden;
  padding: 3px 4px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-align: center;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}
[data-osc-style="own"] .acn-name {
  color: #3c3e44;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
}

.acn-body {
  flex: 1;
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  justify-items: center;
  gap: 8px;
  min-height: 240px;
}
.acn-body-master {
  grid-template-columns: 16px 16px minmax(0, 1fr);
}

/* The meter: an LED ladder set into a black slot. */
.acn-body > .oscar-meter {
  width: 14px;
  height: 100%;
}
[data-osc-style="own"] .acn-body > .oscar-meter {
  width: 14px;
  border: 0;
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px #0a0b0d, inset 0 2px 4px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.5);
}
[data-osc-style="own"] .acn-body > .oscar-meter[orient="vertical"] {
  background-image:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 4px, #0e0f12 4px 6px),
    linear-gradient(to top, #30d158 0%, #5ae07a 60%, #ffb340 80%, #ff453a 100%);
}
.acn-body > .oscar-meter[orient="vertical"]::before {
  top: 0;
  bottom: auto;
  height: calc(100% - var(--oscar-level));
  background: var(--osc-muted);
}
[data-osc-style="own"] .acn-body > .oscar-meter[orient="vertical"]::before {
  border-radius: 4px 4px 0 0;
  background: #101114;
}

/* The fader: a chamfered chrome cap on a dark rail. */
.acn-body > input {
  width: 40px;
  height: 100%;
}
[data-osc-style="own"] .acn-body > input[type="range"] {
  --osc-primary: #8e9096;
  --osc-muted: #15161a;
  --osc-track-size: 6px;
  --osc-thumb: 24px;
}
[data-osc-style="own"] .acn-body > input[type="range"]::-webkit-slider-thumb {
  width: 42px;
  height: 24px;
  margin-left: -18px;
  border: 0;
  border-radius: 5px;
  background:
    linear-gradient(90deg, rgba(0, 0, 0, 0) 0 calc(50% - 1px), #3c3e44 calc(50% - 1px) calc(50% + 1px), rgba(0, 0, 0, 0) calc(50% + 1px)),
    linear-gradient(180deg, #fafbfc, #d9dbe0 45%, #b9bcc2 55%, #d2d4d9);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 4px 8px rgba(0, 0, 0, 0.55);
}
[data-osc-style="own"] .acn-body > input[type="range"]:active::-webkit-slider-thumb {
  animation: acn-cap 480ms ease-out;
}
[data-osc-style="own"] .acn-body > input[type="range"]::-moz-range-thumb {
  width: 42px;
  height: 24px;
  border: 0;
  border-radius: 5px;
  background:
    linear-gradient(90deg, rgba(0, 0, 0, 0) 0 calc(50% - 1px), #3c3e44 calc(50% - 1px) calc(50% + 1px), rgba(0, 0, 0, 0) calc(50% + 1px)),
    linear-gradient(180deg, #fafbfc, #d9dbe0 45%, #b9bcc2 55%, #d2d4d9);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 4px 8px rgba(0, 0, 0, 0.55);
}

[data-osc-style="own"] .acn-body > input[type="range"]:active::-moz-range-thumb {
  animation: acn-cap 480ms ease-out;
}

/* Mute and Solo: black keys, lit when pressed in. */
.acn-strip > button {
  position: relative;
  overflow: hidden;
  width: 100%;
  min-height: 40px;
  padding: 0 4px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.acn-strip > button::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}
[data-osc-style="own"] .acn-strip > button::after {
  background: linear-gradient(115deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0.6) 50%, rgba(255, 255, 255, 0) 70%);
  transform: translateX(-120%);
}
.acn-strip > button.toggle::after {
  animation: acn-glint 650ms ease-out;
}
[data-osc-style="own"] .acn-strip > button {
  border: 0;
  border-radius: 9px;
  background: linear-gradient(180deg, #34363c, #202227);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 2px 0 #0d0e10, 0 3px 6px rgba(0, 0, 0, 0.45);
  color: #e8e9ec;
  transition: background-color 0.1s, box-shadow 0.1s, transform 0.1s;
}
[data-osc-style="own"] .acn-strip > button:hover {
  background: linear-gradient(180deg, #3e4148, #26282e);
}
.acn-strip > button.toggle {
  transform: translateY(2px);
}
[data-osc-style="own"] .acn-mute.toggle,
[data-osc-style="own"] .acn-mute.toggle:hover {
  background: linear-gradient(180deg, #ff6b61, #e5392f);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 0 0 #0d0e10, 0 0 16px rgba(255, 69, 58, 0.65);
  color: #fff4f2;
}
[data-osc-style="own"] .acn-solo.toggle,
[data-osc-style="own"] .acn-solo.toggle:hover {
  background: linear-gradient(180deg, #ffc968, #f5a623);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 0 0 #0d0e10, 0 0 16px rgba(255, 179, 64, 0.65);
  color: #2b1d06;
}

/* ---- under any other widget style: the same desk, in that style's colours ---- */
body:not([data-osc-style="own"]) .acn {
  background: var(--osc-background);
  color: var(--osc-foreground);
}
body:not([data-osc-style="own"]) .acn-header {
  border: 1px solid var(--osc-border);
  background: var(--osc-card);
}
body:not([data-osc-style="own"]) .acn-led {
  background: var(--osc-primary);
}
body:not([data-osc-style="own"]) .acn:has(#acn-master-mute.toggle) .acn-led {
  background: var(--osc-muted);
}
body:not([data-osc-style="own"]) .acn-mute.toggle,
body:not([data-osc-style="own"]) .acn-solo.toggle {
  border-color: var(--osc-primary);
  background-color: var(--osc-primary);
  color: var(--osc-primary-foreground);
}

@media (max-width: 992px) {
  .acn {
    min-height: 0;
    padding: 16px;
  }
  .acn-strips {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .acn-master {
    grid-column: span 2;
  }
  .acn-body {
    min-height: 200px;
  }
}

@media (max-width: 480px) {
  .acn {
    gap: 12px;
    padding: 10px;
  }
  .acn-header {
    padding: 10px 14px;
  }
  .acn-title {
    font-size: 18px;
  }
  .acn-hint {
    display: none;
  }
  .acn-strips {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  [data-osc-style="own"] .acn-strips {
    padding: 10px;
    border-radius: 14px;
  }
  .acn-master {
    grid-column: span 3;
  }
  .acn-body {
    min-height: 170px;
  }
}

/* ---- for anyone who has asked for less motion ---- */
@media (prefers-reduced-motion: reduce) {
  .acn-led,
  .acn-strips::after,
  .acn-strip > button.toggle::after,
  .acn-body > input[type="range"]:active::-webkit-slider-thumb,
  .acn-body > input[type="range"]:active::-moz-range-thumb {
    animation: none !important;
  }
}
</style>
</head>
<body data-osc-style="own" data-osc-appearance="dark">
<div id="acn" class="acn" data-gjs-dmode="flow">

  <header id="acn-header" class="acn-header" data-gjs-dmode="flow">
    <div id="acn-plate" class="acn-plate" data-gjs-dmode="flow">
      <h1 id="acn-title" class="acn-title" data-gjs-dmode="flow">Audio Console</h1>
      <span id="acn-hint" class="acn-hint" data-gjs-dmode="flow">Meters follow /ch/n/level, 0 to 1</span>
    </div>
    <div id="acn-status" class="acn-status" data-gjs-dmode="flow">
      <span id="acn-led" class="acn-led" data-gjs-dmode="flow"></span>
      <span id="acn-status-word" data-gjs-dmode="flow">Live</span>
    </div>
  </header>

  <div id="acn-strips" class="acn-strips" data-gjs-dmode="flow">
    <section id="acn-ch1" class="acn-strip" data-gjs-dmode="flow">
      <span id="acn-ch1-name" class="acn-name" data-gjs-dmode="flow">Kick</span>
      <div id="acn-ch1-body" class="acn-body" data-gjs-dmode="flow">
        <div id="acn-ch1-meter" class="oscar-meter" data-gjs-dmode="flow" data-gjs-message="/ch/1/level"
            data-gjs-listen="true" data-gjs-min="0" data-gjs-max="1" data-gjs-orientation="vertical" data-gjs-peak-hold="1.5"></div>
        <input id="acn-ch1-fader" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
            data-gjs-message="/ch/1/fader" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.75" data-gjs-orientation="vertical">
      </div>
      <button id="acn-ch1-mute" class="acn-mute" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/ch/1/mute">Mute</button>
      <button id="acn-ch1-solo" class="acn-solo" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/ch/1/solo">Solo</button>
    </section>
    <section id="acn-ch2" class="acn-strip" data-gjs-dmode="flow">
      <span id="acn-ch2-name" class="acn-name" data-gjs-dmode="flow">Snare</span>
      <div id="acn-ch2-body" class="acn-body" data-gjs-dmode="flow">
        <div id="acn-ch2-meter" class="oscar-meter" data-gjs-dmode="flow" data-gjs-message="/ch/2/level"
            data-gjs-listen="true" data-gjs-min="0" data-gjs-max="1" data-gjs-orientation="vertical" data-gjs-peak-hold="1.5"></div>
        <input id="acn-ch2-fader" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
            data-gjs-message="/ch/2/fader" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.75" data-gjs-orientation="vertical">
      </div>
      <button id="acn-ch2-mute" class="acn-mute" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/ch/2/mute">Mute</button>
      <button id="acn-ch2-solo" class="acn-solo" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/ch/2/solo">Solo</button>
    </section>
    <section id="acn-ch3" class="acn-strip" data-gjs-dmode="flow">
      <span id="acn-ch3-name" class="acn-name" data-gjs-dmode="flow">Bass</span>
      <div id="acn-ch3-body" class="acn-body" data-gjs-dmode="flow">
        <div id="acn-ch3-meter" class="oscar-meter" data-gjs-dmode="flow" data-gjs-message="/ch/3/level"
            data-gjs-listen="true" data-gjs-min="0" data-gjs-max="1" data-gjs-orientation="vertical" data-gjs-peak-hold="1.5"></div>
        <input id="acn-ch3-fader" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
            data-gjs-message="/ch/3/fader" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.75" data-gjs-orientation="vertical">
      </div>
      <button id="acn-ch3-mute" class="acn-mute" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/ch/3/mute">Mute</button>
      <button id="acn-ch3-solo" class="acn-solo" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/ch/3/solo">Solo</button>
    </section>
    <section id="acn-ch4" class="acn-strip" data-gjs-dmode="flow">
      <span id="acn-ch4-name" class="acn-name" data-gjs-dmode="flow">Guitar</span>
      <div id="acn-ch4-body" class="acn-body" data-gjs-dmode="flow">
        <div id="acn-ch4-meter" class="oscar-meter" data-gjs-dmode="flow" data-gjs-message="/ch/4/level"
            data-gjs-listen="true" data-gjs-min="0" data-gjs-max="1" data-gjs-orientation="vertical" data-gjs-peak-hold="1.5"></div>
        <input id="acn-ch4-fader" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
