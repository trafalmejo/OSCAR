<!doctype html>
<html>
<head>
<title>Live Visuals Controller</title>
<!--
  Live Visuals Controller: a surface for running visuals at a show.

  Open it from Load, or paste this whole file into Import. It is ordinary
  HTML and CSS with two OSCAR additions:

  - data-gjs-* attributes hold each widget's settings (data-gjs-message is its
    OSC address) and data-gjs-dmode="flow", which makes a part move through
    the layout when dragged instead of being pulled out of it.
  - data-osc-style and data-osc-appearance on <body> pick the widget style.

  The layout is a CSS grid that rearranges at 992px and 480px, the widths of
  the editor's Tablet and Mobile views, so edits made in those views land in
  the same media queries.

  OSC addresses:
    /layer/<n>/opacity   /layer/<n>/clip/<n>   /fx/<name>   /fx/position
    /master              /blackout
-->
<style>
/* ---- desktop and landscape tablets: one row of panels ---- */
.lvc {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1.1fr) auto;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "header header header header" "layers clips fx master";
  gap: 16px;
  padding: 16px;
  min-height: 100vh;
}
.lvc-header {
  grid-area: header;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.lvc-title {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
}
.lvc-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--osc-border);
  border-radius: var(--osc-radius);
  background-color: var(--osc-card);
}
.lvc-layers { grid-area: layers; }
.lvc-clips { grid-area: clips; }
.lvc-fx { grid-area: fx; }
.lvc-master { grid-area: master; }
.lvc-heading {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.7;
}
.lvc-label {
  font-size: 12px;
  opacity: 0.7;
  text-align: center;
}
.lvc-faders {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.lvc-fader {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-height: 220px;
}
.lvc-fader > input {
  flex: 1;
  width: 40px;
  height: auto;
  min-height: 160px;
}
.lvc-clip-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: minmax(56px, 1fr);
  gap: 8px;
}
.lvc-clip-grid > button,
.lvc-toggles > button {
  width: 100%;
  height: 100%;
  padding: 0 8px;
}
.lvc-fx-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.lvc-toggles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: 48px;
  gap: 8px;
}
.lvc-pad-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.lvc-pad-wrap > .oscar-xypad {
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
}
/* The one control that has to be found in the dark, first time. */
#lvc-blackout {
  min-height: 48px;
  border-color: #e5484d;
  background-color: #e5484d;
  color: #ffffff;
}
#lvc-blackout.toggle,
#lvc-blackout:hover {
  border-color: #ce2c31;
  background-color: #ce2c31;
  color: #ffffff;
}

/* ---- tablets in portrait: faders beside the master, then clips, then effects ---- */
@media (max-width: 992px) {
  .lvc {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto;
    grid-template-areas: "header header" "layers master" "clips clips" "fx fx";
    min-height: 0;
  }
  .lvc-fx-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: start;
  }
  .lvc-toggles {
    grid-auto-rows: 64px;
  }
}

/* ---- phones: tighter, and the pad under the toggles ---- */
@media (max-width: 480px) {
  .lvc {
    gap: 12px;
    padding: 12px;
  }
  .lvc-panel {
    padding: 12px;
  }
  .lvc-title {
    font-size: 16px;
  }
  /* Both queries match on a phone, so the tablet's align-items is undone too. */
  .lvc-fx-body {
    display: flex;
    align-items: stretch;
  }
  .lvc-clip-grid {
    gap: 6px;
    grid-auto-rows: minmax(48px, 1fr);
  }
  .lvc-clip-grid > button {
    padding: 0 4px;
    font-size: 12px;
  }
  .lvc-toggles {
    grid-auto-rows: 48px;
  }
  .lvc-fader {
    min-height: 180px;
  }
}
</style>
</head>
<body data-osc-style="default" data-osc-appearance="dark">
<div id="lvc" class="lvc" data-gjs-dmode="flow">

  <header id="lvc-header" class="lvc-header" data-gjs-dmode="flow">
    <h1 id="lvc-title" class="lvc-title" data-gjs-dmode="flow">Live Visuals</h1>
    <button id="lvc-blackout" data-gjs-dmode="flow" data-gjs-message="/blackout">Blackout</button>
  </header>

  <section id="lvc-layers" class="lvc-panel lvc-layers" data-gjs-dmode="flow">
    <h2 id="lvc-layers-title" class="lvc-heading" data-gjs-dmode="flow">Layers</h2>
    <div id="lvc-faders" class="lvc-faders" data-gjs-dmode="flow">
      <div id="lvc-fader-1" class="lvc-fader" data-gjs-dmode="flow">
        <input id="lvc-layer-1" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/layer/1/opacity" data-gjs-min="0" data-gjs-max="1" data-gjs-value="1" data-gjs-orientation="vertical">
        <span id="lvc-fader-1-label" class="lvc-label" data-gjs-dmode="flow">1</span>
      </div>
      <div id="lvc-fader-2" class="lvc-fader" data-gjs-dmode="flow">
        <input id="lvc-layer-2" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/layer/2/opacity" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.67" data-gjs-orientation="vertical">
        <span id="lvc-fader-2-label" class="lvc-label" data-gjs-dmode="flow">2</span>
      </div>
      <div id="lvc-fader-3" class="lvc-fader" data-gjs-dmode="flow">
        <input id="lvc-layer-3" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/layer/3/opacity" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.33" data-gjs-orientation="vertical">
        <span id="lvc-fader-3-label" class="lvc-label" data-gjs-dmode="flow">3</span>
      </div>
      <div id="lvc-fader-4" class="lvc-fader" data-gjs-dmode="flow">
        <input id="lvc-layer-4" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/layer/4/opacity" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0" data-gjs-orientation="vertical">
        <span id="lvc-fader-4-label" class="lvc-label" data-gjs-dmode="flow">4</span>
      </div>
    </div>
  </section>

  <section id="lvc-clips" class="lvc-panel lvc-clips" data-gjs-dmode="flow">
    <h2 id="lvc-clips-title" class="lvc-heading" data-gjs-dmode="flow">Clips</h2>
    <div id="lvc-clip-grid" class="lvc-clip-grid" data-gjs-dmode="flow">
      <button id="lvc-clip-1-1" data-gjs-dmode="flow" data-gjs-message="/layer/1/clip/1">L1 C1</button>
      <button id="lvc-clip-1-2" data-gjs-dmode="flow" data-gjs-message="/layer/1/clip/2">L1 C2</button>
      <button id="lvc-clip-1-3" data-gjs-dmode="flow" data-gjs-message="/layer/1/clip/3">L1 C3</button>
      <button id="lvc-clip-1-4" data-gjs-dmode="flow" data-gjs-message="/layer/1/clip/4">L1 C4</button>
      <button id="lvc-clip-2-1" data-gjs-dmode="flow" data-gjs-message="/layer/2/clip/1">L2 C1</button>
      <button id="lvc-clip-2-2" data-gjs-dmode="flow" data-gjs-message="/layer/2/clip/2">L2 C2</button>
      <button id="lvc-clip-2-3" data-gjs-dmode="flow" data-gjs-message="/layer/2/clip/3">L2 C3</button>
      <button id="lvc-clip-2-4" data-gjs-dmode="flow" data-gjs-message="/layer/2/clip/4">L2 C4</button>
      <button id="lvc-clip-3-1" data-gjs-dmode="flow" data-gjs-message="/layer/3/clip/1">L3 C1</button>
      <button id="lvc-clip-3-2" data-gjs-dmode="flow" data-gjs-message="/layer/3/clip/2">L3 C2</button>
      <button id="lvc-clip-3-3" data-gjs-dmode="flow" data-gjs-message="/layer/3/clip/3">L3 C3</button>
      <button id="lvc-clip-3-4" data-gjs-dmode="flow" data-gjs-message="/layer/3/clip/4">L3 C4</button>
      <button id="lvc-clip-4-1" data-gjs-dmode="flow" data-gjs-message="/layer/4/clip/1">L4 C1</button>
      <button id="lvc-clip-4-2" data-gjs-dmode="flow" data-gjs-message="/layer/4/clip/2">L4 C2</button>
      <button id="lvc-clip-4-3" data-gjs-dmode="flow" data-gjs-message="/layer/4/clip/3">L4 C3</button>
      <button id="lvc-clip-4-4" data-gjs-dmode="flow" data-gjs-message="/layer/4/clip/4">L4 C4</button>
    </div>
  </section>

  <section id="lvc-fx" class="lvc-panel lvc-fx" data-gjs-dmode="flow">
    <h2 id="lvc-fx-title" class="lvc-heading" data-gjs-dmode="flow">Effects</h2>
    <div id="lvc-fx-body" class="lvc-fx-body" data-gjs-dmode="flow">
      <div id="lvc-toggles" class="lvc-toggles" data-gjs-dmode="flow">
        <button id="lvc-fx-strobe" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/fx/strobe">Strobe</button>
        <button id="lvc-fx-invert" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/fx/invert">Invert</button>
        <button id="lvc-fx-blur" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/fx/blur">Blur</button>
        <button id="lvc-fx-feedback" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/fx/feedback">Feedback</button>
      </div>
      <div id="lvc-pad-wrap" class="lvc-pad-wrap" data-gjs-dmode="flow">
        <div id="lvc-pad" class="oscar-xypad" data-gjs-dmode="flow" data-gjs-message="/fx/position"
          data-gjs-min-x="0" data-gjs-max-x="1" data-gjs-min-y="0" data-gjs-max-y="1" data-gjs-x="0.5" data-gjs-y="0.5"></div>
        <span id="lvc-pad-label" class="lvc-label" data-gjs-dmode="flow">Position</span>
      </div>
    </div>
  </section>

  <section id="lvc-master" class="lvc-panel lvc-master" data-gjs-dmode="flow">
    <h2 id="lvc-master-title" class="lvc-heading" data-gjs-dmode="flow">Master</h2>
    <div id="lvc-fader-master" class="lvc-fader" data-gjs-dmode="flow">
      <input id="lvc-master-fader" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
        data-gjs-message="/master" data-gjs-min="0" data-gjs-max="1" data-gjs-value="1" data-gjs-orientation="vertical">
      <span id="lvc-master-label" class="lvc-label" data-gjs-dmode="flow">Out</span>
    </div>
  </section>

</div>
</body>
</html>
