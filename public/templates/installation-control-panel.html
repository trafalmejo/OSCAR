<!doctype html>
<html>
<head>
<title>Installation Control Panel</title>
<!--
  Installation Control Panel: a few large, safe controls for the people who
  run an installation day to day. Pair it with locked mode, so staff on the
  venue's Wi-Fi can use the panel without being able to edit it.

  Open it from Load, or paste this whole file into Import. It is ordinary
  HTML and CSS with two OSCAR additions:

  - data-gjs-* attributes hold each widget's settings (data-gjs-message is its
    OSC address) and data-gjs-dmode="flow", which makes a part move through
    the layout when dragged instead of being pulled out of it.
  - data-osc-style and data-osc-appearance on <body> pick the widget style.

  The layout is a CSS grid that rearranges at 992px and 480px, the widths of
  the editor's Tablet and Mobile views, so edits made in those views land in
  the same media queries.

  Scene buttons are momentary: OSCAR has no group of buttons where pressing
  one releases the others, so the panel does not claim to know which scene is
  running.

  OSC addresses:
    /scene/<n>   /level/brightness   /level/volume
    /mode/attract   /mode/sound   /mode/projectors
    /show/restart   /show/stop
-->
<style>
/* ---- desktop and landscape tablets: scenes beside levels and modes ---- */
.icp {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
  /* Levels and modes take the height they need; the scenes fill the rest. */
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "header header" "scenes levels" "scenes modes" "scenes ." "show show";
  gap: 16px;
  padding: 24px;
  min-height: 100vh;
}
.icp-header {
  grid-area: header;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.icp-title {
  margin: 0;
  font-size: 24px;
  font-weight: 600;
}
.icp-subtitle {
  margin: 0;
  font-size: 14px;
  opacity: 0.7;
}
.icp-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--osc-border);
  border-radius: var(--osc-radius);
  background-color: var(--osc-card);
}
.icp-scenes { grid-area: scenes; }
.icp-levels { grid-area: levels; }
.icp-modes { grid-area: modes; }
.icp-show { grid-area: show; }
.icp-heading {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.7;
}
.icp-scene-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: minmax(96px, 1fr);
  gap: 12px;
}
.icp-scene-grid > button {
  width: 100%;
  height: 100%;
  font-size: 16px;
}
.icp-level {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.icp-label {
  font-size: 14px;
  opacity: 0.8;
}
.icp-level > input {
  width: 100%;
}
.icp-mode-list {
  display: grid;
  grid-auto-rows: 56px;
  gap: 12px;
}
.icp-mode-list > button {
  width: 100%;
  height: 100%;
  justify-content: flex-start;
}
.icp-show {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}
.icp-show > button {
  min-height: 56px;
  padding: 0 32px;
}
/* Stop is the one control nobody should press by mistake: red, and at the
   far end from Restart. */
#icp-stop {
  border-color: #e5484d;
  background-color: #e5484d;
  color: #ffffff;
}
#icp-stop.toggle,
#icp-stop:hover {
  border-color: #ce2c31;
  background-color: #ce2c31;
  color: #ffffff;
}

/* ---- tablets in portrait: scenes across the top, levels beside modes ---- */
@media (max-width: 992px) {
  .icp {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: auto;
    grid-template-areas: "header header" "scenes scenes" "levels modes" "show show";
    min-height: 0;
  }
  .icp-scene-grid {
    grid-auto-rows: 88px;
  }
}

/* ---- phones: one column, big targets, Stop last and apart ---- */
@media (max-width: 480px) {
  .icp {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "header" "scenes" "levels" "modes" "show";
    gap: 12px;
    padding: 12px;
  }
  .icp-panel {
    padding: 16px;
  }
  .icp-title {
    font-size: 20px;
  }
  .icp-scene-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 72px;
    gap: 8px;
  }
  .icp-show {
    flex-direction: column;
    align-items: stretch;
    gap: 32px;
  }
  .icp-show > button {
    width: 100%;
  }
}
</style>
</head>
<body data-osc-style="amber-minimal" data-osc-appearance="light">
<div id="icp" class="icp" data-gjs-dmode="flow">

  <header id="icp-header" class="icp-header" data-gjs-dmode="flow">
    <h1 id="icp-title" class="icp-title" data-gjs-dmode="flow">Installation Control</h1>
    <p id="icp-subtitle" class="icp-subtitle" data-gjs-dmode="flow">Choose a scene, set the room, and stop the show if you need to.</p>
  </header>

  <section id="icp-scenes" class="icp-panel icp-scenes" data-gjs-dmode="flow">
    <h2 id="icp-scenes-title" class="icp-heading" data-gjs-dmode="flow">Scenes</h2>
    <div id="icp-scene-grid" class="icp-scene-grid" data-gjs-dmode="flow">
      <button id="icp-scene-1" data-gjs-dmode="flow" data-gjs-message="/scene/1">Welcome</button>
      <button id="icp-scene-2" data-gjs-dmode="flow" data-gjs-message="/scene/2">Main</button>
      <button id="icp-scene-3" data-gjs-dmode="flow" data-gjs-message="/scene/3">Interactive</button>
      <button id="icp-scene-4" data-gjs-dmode="flow" data-gjs-message="/scene/4">Quiet</button>
      <button id="icp-scene-5" data-gjs-dmode="flow" data-gjs-message="/scene/5">Private Event</button>
      <button id="icp-scene-6" data-gjs-dmode="flow" data-gjs-message="/scene/6">Closing</button>
    </div>
  </section>

  <section id="icp-levels" class="icp-panel icp-levels" data-gjs-dmode="flow">
    <h2 id="icp-levels-title" class="icp-heading" data-gjs-dmode="flow">Levels</h2>
    <div id="icp-brightness" class="icp-level" data-gjs-dmode="flow">
      <span id="icp-brightness-label" class="icp-label" data-gjs-dmode="flow">Brightness</span>
      <input id="icp-brightness-slider" type="range" step="0.01" min="0" max="1" orient="horizontal" data-gjs-dmode="flow"
        data-gjs-message="/level/brightness" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.8" data-gjs-orientation="horizontal">
    </div>
    <div id="icp-volume" class="icp-level" data-gjs-dmode="flow">
      <span id="icp-volume-label" class="icp-label" data-gjs-dmode="flow">Volume</span>
      <input id="icp-volume-slider" type="range" step="0.01" min="0" max="1" orient="horizontal" data-gjs-dmode="flow"
        data-gjs-message="/level/volume" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.5" data-gjs-orientation="horizontal">
    </div>
  </section>

  <section id="icp-modes" class="icp-panel icp-modes" data-gjs-dmode="flow">
    <h2 id="icp-modes-title" class="icp-heading" data-gjs-dmode="flow">Modes</h2>
    <div id="icp-mode-list" class="icp-mode-list" data-gjs-dmode="flow">
      <button id="icp-mode-attract" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/mode/attract">Attract mode</button>
      <button id="icp-mode-sound" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/mode/sound">Sound</button>
      <button id="icp-mode-projectors" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/mode/projectors">Projectors</button>
    </div>
  </section>

  <section id="icp-show" class="icp-panel icp-show" data-gjs-dmode="flow">
    <button id="icp-restart" data-gjs-dmode="flow" data-gjs-message="/show/restart">Restart show</button>
    <button id="icp-stop" data-gjs-dmode="flow" data-gjs-message="/show/stop">Stop show</button>
  </section>

</div>
</body>
</html>
