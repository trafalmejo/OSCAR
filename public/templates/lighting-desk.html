<!doctype html>
<html>
<head>
<title>Lighting Desk</title>
<!--
  Lighting Desk: group faders, a colour pad, presets, effects, a master fader
  and a blackout button, for lighting driven from a tablet.

  Open it from Load, or paste this whole file into Import. It is ordinary
  HTML and CSS with two OSCAR additions:

  - data-gjs-* attributes hold each widget's settings (data-gjs-message is its
    OSC address) and data-gjs-dmode="flow", which makes a part move through
    the layout when dragged instead of being pulled out of it.
  - data-osc-style and data-osc-appearance on <body> pick the widget style.

  The layout is a CSS grid that rearranges at 992px and 480px, the widths of
  the editor's Tablet and Mobile views, so edits made in those views land in
  the same media queries.

  The colour pad sends hue across and saturation up, both from 0 to 1, in one
  message.

  OSC addresses:
    /group/<name>/level   /color/hue-saturation   /preset/<name>
    /fx/flash   /fx/strobe   /fx/chase   /master   /blackout
-->
<style>
/* ---- desktop and landscape tablets: one row of panels ---- */
.lgd {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1.2fr) auto;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "header header header header" "groups color presets master" "groups color fx master";
  gap: 16px;
  padding: 16px;
  min-height: 100vh;
}
.lgd-header {
  grid-area: header;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.lgd-title {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
}
.lgd-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--osc-border);
  border-radius: var(--osc-radius);
  background-color: var(--osc-card);
}
.lgd-groups { grid-area: groups; }
.lgd-color { grid-area: color; }
.lgd-presets { grid-area: presets; }
.lgd-fx { grid-area: fx; }
.lgd-master { grid-area: master; }
.lgd-heading {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.7;
}
.lgd-label {
  font-size: 12px;
  opacity: 0.7;
  text-align: center;
}
.lgd-faders {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
}
.lgd-fader {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-height: 220px;
}
.lgd-fader > input {
  flex: 1;
  width: 40px;
  height: auto;
  min-height: 160px;
}
.lgd-pad-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.lgd-pad-wrap > .oscar-xypad {
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
}
.lgd-preset-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: minmax(48px, 1fr);
  gap: 8px;
}
.lgd-fx-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: 48px;
  gap: 8px;
}
.lgd-preset-grid > button,
.lgd-fx-row > button {
  width: 100%;
  height: 100%;
  padding: 0 8px;
}
/* The one control that has to be found in the dark, first time. */
#lgd-blackout {
  min-height: 48px;
  border-color: #e5484d;
  background-color: #e5484d;
  color: #ffffff;
}
#lgd-blackout.toggle,
#lgd-blackout:hover {
  border-color: #ce2c31;
  background-color: #ce2c31;
  color: #ffffff;
}

/* ---- tablets in portrait: faders beside the master, colour beside presets ---- */
@media (max-width: 992px) {
  .lgd {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    grid-template-rows: auto;
    grid-template-areas: "header header header" "groups groups master" "color presets presets" "color fx fx";
    min-height: 0;
  }
  .lgd-preset-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: 56px;
  }
}

/* ---- phones: one column, faders in two rows ---- */
@media (max-width: 480px) {
  .lgd {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "header header" "groups master" "color color" "presets presets" "fx fx";
    gap: 12px;
    padding: 12px;
  }
  .lgd-panel {
    padding: 12px;
  }
  .lgd-title {
    font-size: 16px;
  }
  .lgd-faders {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    row-gap: 16px;
  }
  .lgd-fader {
    min-height: 150px;
  }
  .lgd-fader > input {
    min-height: 110px;
  }
  .lgd-preset-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 48px;
  }
}
</style>
</head>
<body data-osc-style="cyberpunk" data-osc-appearance="dark">
<div id="lgd" class="lgd" data-gjs-dmode="flow">

  <header id="lgd-header" class="lgd-header" data-gjs-dmode="flow">
    <h1 id="lgd-title" class="lgd-title" data-gjs-dmode="flow">Lighting Desk</h1>
    <button id="lgd-blackout" data-gjs-dmode="flow" data-gjs-message="/blackout">Blackout</button>
  </header>

  <section id="lgd-groups" class="lgd-panel lgd-groups" data-gjs-dmode="flow">
    <h2 id="lgd-groups-title" class="lgd-heading" data-gjs-dmode="flow">Groups</h2>
    <div id="lgd-faders" class="lgd-faders" data-gjs-dmode="flow">
      <div id="lgd-fader-front" class="lgd-fader" data-gjs-dmode="flow">
        <input id="lgd-front" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/group/front/level" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.8" data-gjs-orientation="vertical">
        <span id="lgd-front-label" class="lgd-label" data-gjs-dmode="flow">Front</span>
      </div>
      <div id="lgd-fader-back" class="lgd-fader" data-gjs-dmode="flow">
        <input id="lgd-back" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/group/back/level" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.6" data-gjs-orientation="vertical">
        <span id="lgd-back-label" class="lgd-label" data-gjs-dmode="flow">Back</span>
      </div>
      <div id="lgd-fader-left" class="lgd-fader" data-gjs-dmode="flow">
        <input id="lgd-left" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/group/left/level" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.5" data-gjs-orientation="vertical">
        <span id="lgd-left-label" class="lgd-label" data-gjs-dmode="flow">Left</span>
      </div>
      <div id="lgd-fader-right" class="lgd-fader" data-gjs-dmode="flow">
        <input id="lgd-right" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/group/right/level" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.5" data-gjs-orientation="vertical">
        <span id="lgd-right-label" class="lgd-label" data-gjs-dmode="flow">Right</span>
      </div>
      <div id="lgd-fader-wash" class="lgd-fader" data-gjs-dmode="flow">
        <input id="lgd-wash" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/group/wash/level" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0.3" data-gjs-orientation="vertical">
        <span id="lgd-wash-label" class="lgd-label" data-gjs-dmode="flow">Wash</span>
      </div>
      <div id="lgd-fader-spots" class="lgd-fader" data-gjs-dmode="flow">
        <input id="lgd-spots" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
          data-gjs-message="/group/spots/level" data-gjs-min="0" data-gjs-max="1" data-gjs-value="0" data-gjs-orientation="vertical">
        <span id="lgd-spots-label" class="lgd-label" data-gjs-dmode="flow">Spots</span>
      </div>
    </div>
  </section>

  <section id="lgd-color" class="lgd-panel lgd-color" data-gjs-dmode="flow">
    <h2 id="lgd-color-title" class="lgd-heading" data-gjs-dmode="flow">Colour</h2>
    <div id="lgd-pad-wrap" class="lgd-pad-wrap" data-gjs-dmode="flow">
      <div id="lgd-pad" class="oscar-xypad" data-gjs-dmode="flow" data-gjs-message="/color/hue-saturation"
        data-gjs-min-x="0" data-gjs-max-x="1" data-gjs-min-y="0" data-gjs-max-y="1" data-gjs-x="0.5" data-gjs-y="0.5"></div>
      <span id="lgd-pad-label" class="lgd-label" data-gjs-dmode="flow">Hue across, saturation up</span>
    </div>
  </section>

  <section id="lgd-presets" class="lgd-panel lgd-presets" data-gjs-dmode="flow">
    <h2 id="lgd-presets-title" class="lgd-heading" data-gjs-dmode="flow">Presets</h2>
    <div id="lgd-preset-grid" class="lgd-preset-grid" data-gjs-dmode="flow">
      <button id="lgd-preset-warm" data-gjs-dmode="flow" data-gjs-message="/preset/warm">Warm</button>
      <button id="lgd-preset-cool" data-gjs-dmode="flow" data-gjs-message="/preset/cool">Cool</button>
      <button id="lgd-preset-red" data-gjs-dmode="flow" data-gjs-message="/preset/red">Red</button>
      <button id="lgd-preset-blue" data-gjs-dmode="flow" data-gjs-message="/preset/blue">Blue</button>
      <button id="lgd-preset-green" data-gjs-dmode="flow" data-gjs-message="/preset/green">Green</button>
      <button id="lgd-preset-amber" data-gjs-dmode="flow" data-gjs-message="/preset/amber">Amber</button>
      <button id="lgd-preset-white" data-gjs-dmode="flow" data-gjs-message="/preset/white">White</button>
      <button id="lgd-preset-uv" data-gjs-dmode="flow" data-gjs-message="/preset/uv">UV</button>
    </div>
  </section>

  <section id="lgd-fx" class="lgd-panel lgd-fx" data-gjs-dmode="flow">
    <h2 id="lgd-fx-title" class="lgd-heading" data-gjs-dmode="flow">Effects</h2>
    <div id="lgd-fx-row" class="lgd-fx-row" data-gjs-dmode="flow">
      <button id="lgd-fx-flash" data-gjs-dmode="flow" data-gjs-message="/fx/flash">Flash</button>
      <button id="lgd-fx-strobe" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/fx/strobe">Strobe</button>
      <button id="lgd-fx-chase" data-gjs-dmode="flow" data-gjs-mode="toggle" data-gjs-message="/fx/chase">Chase</button>
    </div>
  </section>

  <section id="lgd-master" class="lgd-panel lgd-master" data-gjs-dmode="flow">
    <h2 id="lgd-master-title" class="lgd-heading" data-gjs-dmode="flow">Master</h2>
    <div id="lgd-fader-master" class="lgd-fader" data-gjs-dmode="flow">
      <input id="lgd-master-fader" type="range" step="0.01" min="0" max="1" orient="vertical" data-gjs-dmode="flow"
        data-gjs-message="/master" data-gjs-min="0" data-gjs-max="1" data-gjs-value="1" data-gjs-orientation="vertical">
      <span id="lgd-master-label" class="lgd-label" data-gjs-dmode="flow">Out</span>
    </div>
  </section>

</div>
</body>
</html>
